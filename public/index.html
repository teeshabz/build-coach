<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Build Coach</title>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f2f4f7;
    --dim: #8b95a3;
    --line: #1e242c;
    --amber: #ffb020;
    --green: #38d39f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; filter: brightness(.62);
  }
  .layer { position: fixed; inset: 0; display: flex; flex-direction: column;
           padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }

  /* ---- top row ---- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .status {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: rgba(11,13,16,.72); border: 1px solid var(--line); border-radius: 999px;
    font-size: 13px; letter-spacing: .02em; backdrop-filter: blur(8px);
  }
  .topleft { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .pill {
    padding: 7px 12px; font-size: 12px; font-weight: 500; border-radius: 999px;
    background: rgba(11,13,16,.72); border: 1px solid var(--line); color: var(--dim);
    backdrop-filter: blur(8px);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .dot.listening { background: var(--green); animation: pulse 1.4s infinite; }
  .dot.thinking  { background: var(--amber); animation: pulse .7s infinite; }
  .dot.speaking  { background: #6aa8ff; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  #state {
    background: rgba(11,13,16,.72); border: 1px solid var(--line); border-radius: 12px;
    padding: 9px 11px; font-size: 11px; min-width: 168px; backdrop-filter: blur(8px);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  #state .row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
  #state .k { color: var(--dim); }
  #state .v { text-align: right; }
  #state .v.known { color: var(--green); }
  #facts { margin-top: 6px; border-top: 1px solid var(--line); padding-top: 5px; color: var(--dim); line-height: 1.45; }

  /* ---- speech ---- */
  .spacer { flex: 1; }
  #heard { font-size: 13px; color: var(--dim); margin-bottom: 8px; min-height: 18px; }
  #speech {
    font-size: 26px; line-height: 1.28; font-weight: 500; letter-spacing: -.01em;
    text-shadow: 0 2px 22px rgba(0,0,0,.85); margin-bottom: 18px; min-height: 68px;
  }
  #speech.correction { color: var(--amber); }
  #speech.done { color: var(--green); }

  /* ---- controls ---- */
  .controls { display: flex; gap: 10px; align-items: center; }
  button {
    font: inherit; color: var(--fg); background: rgba(24,28,34,.9); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px; font-weight: 600; backdrop-filter: blur(8px);
  }
  button:active { transform: scale(.97); }
  #next { flex: 1; font-size: 19px; background: rgba(242,244,247,.95); color: #0b0d10; border: none; }
  #look { flex: 1; }
  #mic.on { border-color: var(--green); color: var(--green); }
  .hint { font-size: 11px; color: var(--dim); text-align: center; margin-top: 9px; min-height: 14px; }

  /* ---- start screen ---- */
  #start {
    position: fixed; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 18px; padding: 26px; text-align: center;
  }
  #start h1 {
    margin: 0 0 4px;
    /* SF Rounded on Apple devices - friendlier than the UI face, and no download to fail on venue wifi */
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    font-size: clamp(52px, 17vw, 78px); font-weight: 800; line-height: .95; letter-spacing: -.035em;
    background: linear-gradient(160deg, #fff 30%, #7fd8b4 115%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #start p { margin: 0; color: var(--dim); font-size: 15px; max-width: 20em; }
  #go { width: 100%; max-width: 320px; }
  #goal {
    width: 100%; min-height: 108px; padding: 14px; font: inherit; resize: none;
    background: #11151a; color: var(--fg); border: 1px solid var(--line); border-radius: 14px;
  }
  #go { background: var(--fg); color: #0b0d10; border: none; padding: 18px; font-size: 18px; }
  #err { color: var(--amber); font-size: 13px; min-height: 16px; }
  .link { background: none; border: none; color: var(--dim); font-size: 14px; padding: 4px; font-weight: 400; }
  #s-mode-phase.build { color: var(--green); font-weight: 700; }
  @keyframes flash { 0%, 100% { background: transparent } 35% { background: rgba(56,211,159,.28) } }
  #state.switched { animation: flash 1.1s ease-out 2; }
</style>
</head>
<body>

<video id="video" playsinline muted autoplay></video>

<div class="layer">
  <div class="top">
    <div class="topleft">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
      <button id="reset" class="pill">↺ Start over</button>
    </div>
    <div id="state">
      <div class="row"><span class="k">phase</span><span class="v" id="s-mode-phase">intake</span></div>
      <div class="row"><span class="k">step</span><span class="v" id="s-step">-</span></div>
      <div class="row"><span class="k">wall</span><span class="v" id="s-wall">unknown</span></div>
      <div class="row"><span class="k">finder</span><span class="v" id="s-mode">unknown</span></div>
      <div class="row"><span class="k">hardware</span><span class="v" id="s-hw">unknown</span></div>
      <div id="facts"></div>
    </div>
  </div>

  <div class="spacer"></div>

  <div id="heard"></div>
  <div id="speech"></div>

  <div class="controls">
    <button id="next">Next</button>
    <button id="look">How's this?</button>
    <button id="mic">🎤 Listen</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div id="start">
  <h1>Build<br>Coach</h1>
  <p>Point your camera at the job. Talk to it like a person.</p>
  <button id="go">Start</button>
  <button id="typeToggle" class="link">or type instead</button>
  <textarea id="goal" hidden placeholder="I want to hang a plant from the ceiling. I have these hooks and a stud finder."></textarea>
  <div id="err"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video");
const canvas = document.createElement("canvas");

let state = null;
let history = [];
let busy = false;
let handsFree = false; // buttons first; flip on with the Voice button
let recog = null;
let run = null; // one id per demo run, groups the recorded turns
const OPENING = "What are you building today?";
let speaking = false;

/* ---------- camera ---------- */
async function startCamera() {
  if (video.srcObject) return; // still running from the previous round
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 960 } },
    audio: false,
  });
  video.srcObject = stream;
  await video.play();
}

function grabFrame() {
  if (!video.videoWidth) return null;
  const w = 768;
  const h = Math.round((video.videoHeight / video.videoWidth) * w);
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(video, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.72).split(",")[1];
}

/* ---------- voice out ---------- */
function say(text) {
  return new Promise((resolve) => {
    if (!window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.pitch = 1; u.lang = "en-US";
    const v = speechSynthesis.getVoices().find((v) => /Samantha|Google US English|Alex/.test(v.name));
    if (v) u.voice = v;
    speaking = true;
    setStatus("speaking", "speaking");
    stopListening();
    const finish = () => { speaking = false; resolve(); listenAgain(); };
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
  });
}

/* ---------- voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function buildRecognizer() {
  if (!SR) { $("hint").textContent = "Speech recognition unavailable here - use the buttons."; return null; }
  const r = new SR();
  r.lang = "en-US";
  r.interimResults = true; // show partial words so you can see it hearing you
  r.maxAlternatives = 1;
  r.continuous = false; // iOS ignores continuous; we restart manually
  r.onresult = (e) => {
    const res = e.results[e.results.length - 1];
    const said = res[0].transcript.trim();
    if (!res.isFinal) {
      $("heard").textContent = said ? "… " + said : "";
      return;
    }
    // one-word noise ("uh", a cough registering as "the") shouldn't fire a turn
    if (said.length < 2 || /^(uh|um|ah|oh|hm+)$/i.test(said)) { $("heard").textContent = ""; return; }
    turn(said);
  };
  r.onend = () => { if (handsFree && !busy && !speaking) safeStart(); };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      handsFree = false; setVoiceButton();
      $("hint").textContent = "Mic blocked - tap Next / How's this? instead.";
    }
  };
  return r;
}

function safeStart() {
  if (!recog || busy || speaking) return;
  try { recog.start(); setStatus("listening", "listening"); }
  catch { /* already started */ }
}
function stopListening() { try { recog && recog.stop(); } catch {} }
function listenAgain() { if (handsFree) setTimeout(safeStart, 250); else setStatus("", "ready"); }

/* ---------- a turn ---------- */
function setStatus(cls, text) {
  $("dot").className = "dot " + cls;
  $("statusText").textContent = text;
}

function renderState(s) {
  if (!s) return;
  const put = (id, val) => {
    const el = $(id);
    el.textContent = val || "unknown";
    el.classList.toggle("known", !!val && val !== "unknown" && val !== "not visible");
  };
  const phase = $("s-mode-phase");
  if (s.mode && phase.textContent !== s.mode) {
    phase.textContent = s.mode;
    phase.classList.toggle("build", s.mode === "build");
    if (s.mode === "build") { // the moment it stops asking and starts coaching
      $("state").classList.remove("switched");
      void $("state").offsetWidth; // restart the animation
      $("state").classList.add("switched");
    }
  }
  put("s-step", s.step); put("s-wall", s.wall_material);
  put("s-mode", s.stud_finder_mode); put("s-hw", s.hardware);
  $("facts").innerHTML = (s.facts || []).slice(-4).map((f) => "· " + f).join("<br>");
}

async function turn(utterance) {
  if (busy) return;
  busy = true;
  stopListening();
  $("heard").textContent = utterance.startsWith("(") ? "" : "“" + utterance + "”";
  setStatus("thinking", "thinking");

  const image = grabFrame();
  try {
    const res = await fetch("/api/next", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ utterance, image, state, history, run }),
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    state = data.state;
    renderState(state);
    history.push({ role: "user", text: utterance }, { role: "agent", text: data.speech });

    const box = $("speech");
    box.className = data.correction ? "correction" : data.done ? "done" : "";
    box.textContent = data.speech;
    $("hint").textContent = data.ms ? data.ms + "ms" : "";

    busy = false;
    await say(data.speech);
  } catch (err) {
    $("speech").textContent = "";
    $("hint").textContent = "Error: " + err.message;
    busy = false;
    listenAgain();
  }
}

/* ---------- wiring ---------- */
$("go").addEventListener("click", async () => {
  try {
    await startCamera();
  } catch (err) {
    $("err").textContent = "Camera blocked: " + err.message + " (needs https + permission)";
    return;
  }
  // iOS requires a user gesture to unlock audio output
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  try { navigator.wakeLock?.request("screen"); } catch {}

  recog = buildRecognizer();
  handsFree = !!recog; // intake is a conversation, so start listening
  setVoiceButton();
  run = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  const goal = $("goal").value.trim();
  $("start").style.display = "none";

  if (goal) { turn(goal); return; }
  // Always the same first line, so say it straight away rather than spending
  // a round trip on it. Their answer is the first real turn.
  $("speech").textContent = OPENING;
  history.push({ role: "agent", text: OPENING });
  await say(OPENING);
});

$("typeToggle").addEventListener("click", () => {
  const box = $("goal");
  box.hidden = !box.hidden;
  $("typeToggle").textContent = box.hidden ? "or type it instead" : "never mind, I'll talk";
  if (!box.hidden) box.focus();
});

$("next").addEventListener("click", () => turn("Next."));
$("look").addEventListener("click", () => turn("Does this look good?"));
$("mic").addEventListener("click", () => {
  if (!recog) return;
  handsFree = !handsFree;
  setVoiceButton();
  if (handsFree) safeStart(); else { stopListening(); setStatus("", "ready"); }
});

$("reset").addEventListener("click", () => {
  try { speechSynthesis.cancel(); } catch {}
  stopListening();
  handsFree = false;
  busy = false;
  speaking = false;
  state = null;
  history = [];
  run = null; // next Start opens a fresh recording
  $("heard").textContent = "";
  $("speech").textContent = "";
  $("speech").className = "";
  $("hint").textContent = "";
  $("err").textContent = "";
  $("facts").innerHTML = "";
  $("s-mode-phase").textContent = "intake";
  $("s-mode-phase").classList.remove("build");
  $("state").classList.remove("switched");
  for (const id of ["s-step", "s-wall", "s-mode", "s-hw"]) {
    $(id).textContent = id === "s-step" ? "-" : "unknown";
    $(id).classList.remove("known");
  }
  setStatus("", "idle");
  setVoiceButton();
  $("start").style.display = "flex"; // camera keeps running, so Start is instant
});

function setVoiceButton() {
  $("mic").classList.toggle("on", handsFree && !!recog);
  // label says what tapping it DOES, so there's no reading required mid-demo
  $("mic").textContent = !recog ? "No mic" : handsFree ? "❚❚ Pause" : "🎤 Listen";
  $("hint").textContent = handsFree ? "" : recog ? "mic paused - talk freely" : "";
}
</script>
</body>
</html>

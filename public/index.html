<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Build Coach</title>
<style>
  :root {
    --bg: #0b0d10;
    --fg: #f2f4f7;
    --dim: #8b95a3;
    --line: #1e242c;
    --amber: #ffb020;
    --say: #ffb257;      /* what the coach says */
    --alert: #ff7d4d;    /* ...and when it's stopping you */
    --green: #38d39f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.45 ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
  }

  /* On a phone the app is the whole screen. On a laptop it sits in a 9:16
     frame, so a screen recording crops straight to a vertical video. */
  #app { position: fixed; inset: 0; overflow: hidden; }
  @media (min-width: 700px) {
    body { background: #07080a; display: grid; place-items: center; }
    /* Square edges by default: a screen grab crops straight to a clean vertical
       video, rather than filming a picture of a phone. ?bezel puts it back. */
    #app {
      position: relative; inset: auto;
      height: min(94vh, 900px); aspect-ratio: 9 / 19.5;
    }
    body.bezel #app {
      border-radius: 46px; border: 1px solid #23282f;
      box-shadow: 0 40px 90px rgba(0,0,0,.6), 0 0 0 9px #14171b;
    }
  }

  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000; filter: brightness(.66) saturate(1.05);
  }
  /* keeps text readable over any camera scene without dimming the whole frame */
  .scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,9,11,.78) 0%, rgba(7,9,11,.15) 30%,
                rgba(7,9,11,.35) 58%, rgba(7,9,11,.92) 100%);
  }
  .layer { position: absolute; inset: 0; display: flex; flex-direction: column;
           padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); }

  /* ---- top row ---- */
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .status {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    background: rgba(11,13,16,.72); border: 1px solid var(--line); border-radius: 999px;
    font-size: 13px; letter-spacing: .02em; backdrop-filter: blur(8px);
  }
  .topleft { display: flex; flex-direction: column; align-items: flex-start; gap: 7px; }
  .pill {
    padding: 7px 12px; font-size: 12px; font-weight: 500; border-radius: 999px;
    background: rgba(11,13,16,.72); border: 1px solid var(--line); color: var(--dim);
    backdrop-filter: blur(8px);
  }
  .pill.icon { font-size: 16px; line-height: 1; padding: 8px 11px; }
  /* front camera reads as a mirror to the person in front of it; the frame we
     send the model is drawn from the raw video, so it stays unmirrored */
  #video.mirrored { transform: scaleX(-1); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
  .dot.listening { background: var(--green); box-shadow: 0 0 0 0 rgba(56,211,159,.55); animation: ring 1.8s infinite; }
  .dot.thinking  { background: var(--amber); animation: pulse .7s infinite; }
  .dot.speaking  { background: #6aa8ff; box-shadow: 0 0 0 0 rgba(106,168,255,.5); animation: ring 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  @keyframes ring {
    0%   { box-shadow: 0 0 0 0 currentColor; opacity: 1 }
    70%  { box-shadow: 0 0 0 11px rgba(0,0,0,0); opacity: .85 }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); opacity: 1 }
  }

  #state {
    background: rgba(12,15,19,.66); border: 1px solid rgba(255,255,255,.09);
    border-radius: 18px; padding: 12px 14px; font-size: 12.5px; width: 62%; max-width: 230px;
    backdrop-filter: blur(16px) saturate(1.2);
  }
  .statehead {
    font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase;
    color: rgba(255,255,255,.42); margin-bottom: 8px; font-weight: 600;
  }
  #state .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; align-items: baseline; }
  #state .k { color: rgba(255,255,255,.5); white-space: nowrap; }
  #state .v { text-align: right; font-weight: 600; color: rgba(255,255,255,.55); white-space: nowrap; }
  #state .v.known { color: var(--green); }
  /* newest note on top, fixed height so the card never grows into the shot */
  #facts { color: rgba(255,255,255,.72); font-size: 11.5px; line-height: 1.45;
           max-height: 108px; overflow-y: auto; scrollbar-width: none; }
  #facts::-webkit-scrollbar { display: none; }
  #facts div { padding: 3px 0; animation: liftin .45s ease-out; }
  #facts div + div { border-top: 1px solid rgba(255,255,255,.07); }
  #facts div:first-child { color: var(--green); }
  @keyframes liftin { from { opacity: 0; transform: translateY(5px) } to { opacity: 1 } }

  /* ---- speech ---- */
  .spacer { flex: 1; }  /* everything lives top and bottom - the middle stays clear for you */
  /* Two fixed boxes. Neither grows with the text - long replies scroll inside
     the lower one instead of swallowing the frame. */
  #heard, #speech {
    border: 1px solid rgba(255,255,255,.13); border-radius: 16px;
    background: rgba(10,13,16,.62); backdrop-filter: blur(16px) saturate(1.2);
    overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
  }
  #heard::-webkit-scrollbar, #speech::-webkit-scrollbar { display: none; }

  #heard {
    font-size: 13px; color: #fff; font-weight: 550;
    padding: 8px 12px; margin-bottom: 8px;
    min-height: 34px; max-height: 52px;   /* about two lines, then it scrolls */
  }
  #speech {
    font-size: clamp(15px, 3.7vw, 18px); line-height: 1.38; font-weight: 500; letter-spacing: -.008em;
    color: var(--say);
    padding: 11px 13px; margin-bottom: 10px;
    min-height: 62px; max-height: 21vh;   /* stays a panel, never a paragraph */
    animation: liftin .35s ease-out;
  }
  #speech.correction { color: var(--alert); }
  #speech.done { color: var(--green); }
  /* the correction is the moment of the demo - make the whole frame register it */
  #app.correcting::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    box-shadow: inset 0 0 0 3px var(--amber), inset 0 0 60px rgba(255,176,32,.28);
    animation: alert 1.5s ease-out;
  }
  @keyframes alert { 0% { opacity: 0 } 18% { opacity: 1 } 100% { opacity: 0 } }

  /* ---- controls ---- */
  .controls { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
  .controls #mic {
    font-size: 13px; font-weight: 600; padding: 9px 15px; border-radius: 999px;
    background: rgba(11,13,16,.7);
  }
  button {
    font: inherit; color: var(--fg); background: rgba(26,31,38,.82); border: 1px solid rgba(255,255,255,.1);
    border-radius: 17px; padding: 15px 16px; font-weight: 650; backdrop-filter: blur(14px);
    transition: transform .12s ease;
  }
  button:active { transform: scale(.96); }
  .controls button { white-space: nowrap; }
  #mic.on { border-color: rgba(56,211,159,.55); color: var(--green); background: rgba(56,211,159,.1); }
  .hint { font-size: 11px; color: rgba(255,255,255,.38); text-align: right; margin-top: 7px; min-height: 13px; }

  /* ---- start screen ---- */
  #start {
    position: absolute; inset: 0; background: var(--bg); z-index: 10;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 18px; padding: 26px; text-align: center;
  }
  #start h1 {
    margin: 0 0 4px;
    /* SF Rounded on Apple devices - friendlier than the UI face, and no download to fail on venue wifi */
    font-family: ui-rounded, "SF Pro Rounded", "Avenir Next Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
    font-size: clamp(52px, 17vw, 78px); font-weight: 800; line-height: .95; letter-spacing: -.035em;
    background: linear-gradient(160deg, #fff 30%, #7fd8b4 115%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #start p { margin: 0; color: var(--dim); font-size: 15px; max-width: 20em; }
  #go { width: 100%; max-width: 320px; }
  #goal {
    width: 100%; min-height: 108px; padding: 14px; font: inherit; resize: none;
    background: #11151a; color: var(--fg); border: 1px solid var(--line); border-radius: 14px;
  }
  #go { background: var(--fg); color: #0b0d10; border: none; padding: 18px; font-size: 18px; }
  #err { color: var(--amber); font-size: 13px; min-height: 16px; }
  .link { background: none; border: none; color: var(--dim); font-size: 14px; padding: 4px; font-weight: 400; }
  #s-mode-phase.build { color: var(--green); font-weight: 700; }
  @keyframes flash { 0%, 100% { background: transparent } 35% { background: rgba(56,211,159,.28) } }
  #state.switched { animation: flash 1.1s ease-out 2; }
</style>
</head>
<body>

<div id="app">
<video id="video" playsinline muted autoplay></video>
<div class="scrim"></div>

<div class="layer">
  <div class="top">
    <div class="topleft">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">idle</span></div>
      <button id="reset" class="pill">↺ Start over</button>
      <button id="flip" class="pill icon" title="Switch camera">⇋</button>
    </div>
    <div id="state">
      <div class="statehead">What I know so far</div>
      <div id="facts"></div>
      <span id="s-mode-phase" hidden>intake</span>
      <span id="s-step" hidden>-</span>
      <span id="s-wall" hidden></span><span id="s-mode" hidden></span><span id="s-hw" hidden></span>
    </div>
  </div>

  <div class="spacer"></div>

  <div id="heard"></div>
  <div id="speech"></div>


  <div class="controls">
    <button id="mic">🎤 Listen</button>
  </div>
  <div class="hint" id="hint"></div>
</div>

<div id="start">
  <h1>Build<br>Coach</h1>
  <p>Point your camera at the job. Talk to it like a person.</p>
  <button id="go">Start</button>
  <button id="typeToggle" class="link">or type instead</button>
  <textarea id="goal" hidden placeholder="I want to hang a plant from the ceiling. I have these hooks and a stud finder."></textarea>
  <div id="err"></div>
</div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video");
const canvas = document.createElement("canvas");

let state = null;
let history = [];
let busy = false;
let handsFree = false; // buttons first; flip on with the Voice button
let recog = null;
let run = null; // one id per demo run, groups the recorded turns
const OPENING = "What are you building today?";
const DEBUG = new URLSearchParams(location.search).has("debug"); // ?debug shows timings
// ?bezel shows the phone mockup frame; plain is square-edged for recording
if (new URLSearchParams(location.search).has("bezel")) document.body.classList.add("bezel");
let speaking = false;

/* ---------- camera ---------- */
let facing = localStorage.getItem("facing") || "environment"; // remembered between runs

async function startCamera(force) {
  if (video.srcObject && !force) return; // still running from the previous round
  if (video.srcObject) for (const t of video.srcObject.getTracks()) t.stop();
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 960 } },
    audio: false,
  });
  video.srcObject = stream;
  video.classList.toggle("mirrored", facing === "user");
  await video.play();
}

async function flipCamera() {
  facing = facing === "environment" ? "user" : "environment";
  localStorage.setItem("facing", facing);
  try {
    await startCamera(true);
  } catch (err) {
    facing = facing === "user" ? "environment" : "user"; // no such camera - go back
    localStorage.setItem("facing", facing);
    await startCamera(true);
  }
}

function grabFrame() {
  if (!video.videoWidth) return null;
  const w = 768;
  const h = Math.round((video.videoHeight / video.videoWidth) * w);
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(video, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.72).split(",")[1];
}

/* ---------- voice out ---------- */
let chosenVoice = null;

/* The default system voice is the robotic one. Apple ships far better voices
   but only downloads them on request - Settings > Accessibility > Spoken
   Content > Voices. Prefer them in order of how human they sound. */
function pickVoice() {
  const voices = speechSynthesis.getVoices().filter((v) => v.lang.startsWith("en"));
  if (!voices.length) return null;
  // ?voice=Ava picks one by name; ?voices lists what this device actually has
  const want = new URLSearchParams(location.search).get("voice");
  if (want) {
    const named = voices.find((v) => v.name.toLowerCase().includes(want.toLowerCase()));
    if (named) { console.log("voice (forced):", named.name); return named; }
  }
  if (new URLSearchParams(location.search).has("voices")) {
    $("speech").textContent = voices.map((v) => v.name).join(" · ");
  }
  const rank = (v) => {
    const n = v.name;
    if (/premium|siri/i.test(n)) return 0;
    if (/enhanced/i.test(n)) return 1;
    if (/Ava|Zoe|Evan|Nathan|Serena/i.test(n)) return 2;   // Apple's newer neural set
    if (/^Google/i.test(n)) return 3;                      // Chrome's remote voices
    if (/Allison|Samantha|Karen|Moira|Tessa/i.test(n)) return 4; // older compact voices
    return 5;
  };
  const best = voices.sort((a, b) => rank(a) - rank(b))[0];
  console.log("voice:", best.name, "of", voices.length, "available");
  if (DEBUG) $("hint").textContent = "voice: " + best.name;
  return best;
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { chosenVoice = null; };
let queued = 0;

function speakChunk(text) {
  if (!window.speechSynthesis || !text || !text.trim()) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.05; u.pitch = 1; u.lang = "en-US";
  if (!chosenVoice) chosenVoice = pickVoice();
  if (chosenVoice) u.voice = chosenVoice;

  queued++;
  speaking = true;
  setStatus("speaking", "speaking…");
  stopListening(); // never let it hear itself
  const finish = () => {
    if (--queued > 0) return;      // more sentences still to play
    speaking = false;
    listenAgain();
  };
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u); // queues behind anything already playing
}

function stopSpeaking() {
  try { speechSynthesis.cancel(); } catch {}
  queued = 0;
  speaking = false;
}

/* ---------- voice in ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function buildRecognizer() {
  if (!SR) { $("hint").textContent = "Speech recognition unavailable here - use the buttons."; return null; }
  const r = new SR();
  r.lang = "en-US";
  r.interimResults = true; // show partial words so you can see it hearing you
  r.maxAlternatives = 1;
  r.continuous = true; // Chrome keeps the session open; iOS ignores it and we restart on end
  r.onresult = (e) => {
    const res = e.results[e.results.length - 1];
    const said = res[0].transcript.trim();
    if (!res.isFinal) {
      $("heard").textContent = said ? "… " + said : "";
      return;
    }
    // one-word noise ("uh", a cough registering as "the") shouldn't fire a turn
    if (said.length < 2 || /^(uh|um|ah|oh|hm+)$/i.test(said)) return;
    queueSpeech(said);
  };
  r.onend = () => { if (handsFree && !speaking) safeStart(); };
  r.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      handsFree = false; setVoiceButton();
      $("hint").textContent = "Mic blocked - tap Next / How's this? instead.";
    }
  };
  return r;
}

/* Chrome finalises a result on any short pause, so "should I drill in the
   screw" arrives as two fragments and the second half is lost. Collect the
   fragments and only send once they have actually stopped talking. */
const SILENCE_MS = 1400;
const QUICK_MS = 300;
// Short commands are complete the moment they land - waiting 1.4s to see if
// "next" turns into a longer sentence just adds silence to every single turn.
const COMPLETE = /^(ok(ay)?[ ,]*)?(next|done|go|yes|no|yep|nope|stop|wait|how'?s this|does this look good|what now|now what)[.?!]?$/i;
let pending = "";
let pendingTimer = null;

function queueSpeech(text) {
  pending = (pending ? pending + " " : "") + text;
  $("heard").textContent = "“" + pending + "”";
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(flushSpeech, COMPLETE.test(pending.trim()) ? QUICK_MS : SILENCE_MS);
}

function flushSpeech() {
  clearTimeout(pendingTimer);
  const said = pending.trim();
  pending = "";
  if (said.length >= 2) turn(said);
}

function safeStart() {
  if (!recog || speaking) return; // thinking is fine - they may still be talking
  try { recog.start(); setStatus("listening", "listening"); }
  catch { /* already started */ }
}
function stopListening() { try { recog && recog.stop(); } catch {} }
function listenAgain() { if (handsFree) setTimeout(safeStart, 250); else setStatus("", "ready"); }

/* ---------- a turn ---------- */
function setStatus(cls, text) {
  $("dot").className = "dot " + cls;
  $("statusText").textContent = text;
}

function renderState(s) {
  if (!s) return;
  const put = (id, val) => { const el = $(id); if (el) el.textContent = val || ""; };
  const phase = $("s-mode-phase");
  if (s.mode && phase.textContent !== s.mode) {
    phase.textContent = s.mode;
    phase.classList.toggle("build", s.mode === "build");
    if (s.mode === "build") { // the moment it stops asking and starts coaching
      $("state").classList.remove("switched");
      void $("state").offsetWidth; // restart the animation
      $("state").classList.add("switched");
    }
  }
  put("s-step", s.step); put("s-wall", s.wall_material);
  put("s-mode", s.stud_finder_mode); put("s-hw", s.hardware);
  // newest first, and only rebuild when something actually changed so settled
  // notes don't re-animate on every turn
  const facts = (s.facts || []).slice().reverse();
  const key = facts.join("|");
  if (key !== $("facts").dataset.key) {
    $("facts").dataset.key = key;
    $("facts").innerHTML = facts.map((f) => "<div>" + f + "</div>").join("");
    $("facts").scrollTop = 0;
  }
}

let inflight = null;

async function turn(utterance) {
  if (inflight) inflight.abort(); // they carried on talking - that answer is stale
  const ctrl = new AbortController();
  inflight = ctrl;
  busy = true;
  $("heard").textContent = "“" + utterance + "”";
  setStatus("thinking", "looking…");

  const image = grabFrame();
  try {
    const res = await fetch("/api/next", {
      method: "POST",
      headers: { "content-type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({ utterance, image, state, history, run }),
    });

    const box = $("speech");
    box.className = "";
    box.textContent = "";
    stopSpeaking(); // whatever it was saying belongs to the previous turn

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let data = null;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl).trim();
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const msg = JSON.parse(line);
        if (msg.t === "error") throw new Error(msg.error);
        if (msg.t === "speech") {
          // first words are out before the model has finished the rest
          box.textContent = (box.textContent ? box.textContent + " " : "") + msg.text;
          box.scrollTop = box.scrollHeight; // keep pace with what's being said
          speakChunk(msg.text);
        }
        if (msg.t === "done") data = msg;
      }
    }
    if (!data) throw new Error("stream ended without a result");

    state = data.state;
    renderState(state);
    history.push({ role: "user", text: utterance }, { role: "agent", text: data.speech });

    box.className = data.correction ? "correction" : data.done ? "done" : "";
    box.textContent = data.speech;
    box.scrollTop = box.scrollHeight;
    if (data.correction) { // the frame itself reacts - this is the moment
      $("app").classList.remove("correcting");
      void $("app").offsetWidth;
      $("app").classList.add("correcting");
    }
    if (!queued && !speaking) speakChunk(data.speech); // streaming off, or nothing sent
    if (DEBUG) $("hint").textContent = data.firstWordAt ? data.firstWordAt + "ms to speech, " + data.ms + "ms total" : data.ms + "ms";

    busy = false;
    inflight = null;
  } catch (err) {
    if (err.name === "AbortError") return; // superseded, a newer turn owns the screen
    $("speech").textContent = "";
    $("hint").textContent = "Error: " + err.message;
    busy = false;
    inflight = null;
    listenAgain();
  }
}

/* ---------- wiring ---------- */
$("go").addEventListener("click", async () => {
  try {
    await startCamera();
  } catch (err) {
    $("err").textContent = "Camera blocked: " + err.message + " (needs https + permission)";
    return;
  }
  // iOS requires a user gesture to unlock audio output
  if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  try { navigator.wakeLock?.request("screen"); } catch {}

  recog = buildRecognizer();
  handsFree = !!recog; // intake is a conversation, so start listening
  setVoiceButton();
  run = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
  const goal = $("goal").value.trim();
  $("start").style.display = "none";

  if (goal) { turn(goal); return; }
  // Always the same first line, so say it straight away rather than spending
  // a round trip on it. Their answer is the first real turn.
  $("speech").textContent = OPENING;
  history.push({ role: "agent", text: OPENING });
  speakChunk(OPENING);
});

$("typeToggle").addEventListener("click", () => {
  const box = $("goal");
  box.hidden = !box.hidden;
  $("typeToggle").textContent = box.hidden ? "or type it instead" : "never mind, I'll talk";
  if (!box.hidden) box.focus();
});

function tapped(text) {
  clearTimeout(pendingTimer);
  pending = "";
  turn(text);
}
$("flip").addEventListener("click", flipCamera);

/* No Next button any more - tapping the camera view advances instead. Keeps the
   frame clean for filming while leaving a way through if the mic gives out. */
$("app").addEventListener("click", (e) => {
  if (e.target.closest("button, textarea, #start, #state")) return;
  if (busy || speaking) return;
  tapped("Next.");
});
$("mic").addEventListener("click", () => {
  if (!recog) return;
  handsFree = !handsFree;
  setVoiceButton();
  if (handsFree) safeStart(); else { stopListening(); setStatus("", "ready"); }
});

$("reset").addEventListener("click", () => {
  stopSpeaking();
  stopListening();
  clearTimeout(pendingTimer);
  pending = "";
  if (inflight) { inflight.abort(); inflight = null; }
  handsFree = false;
  busy = false;
  speaking = false;
  state = null;
  history = [];
  run = null; // next Start opens a fresh recording
  $("heard").textContent = "";
  $("speech").textContent = "";
  $("speech").className = "";
  $("hint").textContent = "";
  $("err").textContent = "";
  $("facts").innerHTML = "";
  $("s-mode-phase").textContent = "intake";
  $("s-mode-phase").classList.remove("build");
  $("state").classList.remove("switched");
  for (const id of ["s-step", "s-wall", "s-mode", "s-hw"]) {
    $(id).textContent = id === "s-step" ? "-" : "unknown";
    $(id).classList.remove("known");
  }
  setStatus("", "idle");
  setVoiceButton();
  $("start").style.display = "flex"; // camera keeps running, so Start is instant
});

function setVoiceButton() {
  const live = handsFree && !!recog;
  $("mic").classList.toggle("on", live);
  // label says what tapping it DOES, so there's no reading required mid-demo
  $("mic").textContent = !recog ? "No mic" : handsFree ? "❚❚ Pause" : "🎤 Listen";
  document.querySelector(".controls").classList.toggle("voice", live);
  $("hint").textContent = handsFree ? "" : recog ? "mic paused — tap Listen when you're ready" : "";
}
</script>
</body>
</html>
